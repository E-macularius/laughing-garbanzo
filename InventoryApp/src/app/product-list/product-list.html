<h2>Product Inventory</h2>

<div *ngIf="isLoading">Loading...</div>

<div *ngIf="errorMessage" style="color: red; border: 1px solid red; padding: 10px;">
  {{ errorMessage }}
</div>

<table *ngIf="!isLoading && !errorMessage" border="1" cellspacing="0" cellpadding="5">
  <thead>
    <tr>
      <th>Name</th>
      <th>Category</th>
      <th>Price</th>
      <th>Stock</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let product of products">
      <td>{{ product.name }}</td>
      <td>{{ product.categoryName }}</td>
      <td>{{ product.price | currency }}</td>
      <td [style.color]="product.stockQuantity === 0 ? 'red' : 'black'">
        {{ product.stockQuantity }}
      </td>
    </tr>
  </tbody>
</table>
